name: Build Android AAR

on:
  push:
    branches: [ 1.8.0-fongmi ]
  pull_request:
    branches: [ 1.8.0-fongmi ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: 1.8.0-fongmi  # 指定分支

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release AARs
      run: ./gradlew assembleRelease

    - name: List built AARs
      run: find . -path "*/build/outputs/aar/*.aar"  # 列出所有生成的AAR

    - name: Upload AAR artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-aars
        path: |
          */build/outputs/aar/*.aar
          !**/debug/**  # 排除debug版本的AAR（如果需要）
        if-no-files-found: error  # 如果没有找到AAR文件则报错
