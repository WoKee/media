name: Build FFmpeg Static Libs & Assemble AARs

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [ release-1.11.0-fongmi ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          local-cache: false
          add-to-path: true

      - name: Clone FFmpeg source
        run: |
          cd libraries/decoder_ffmpeg/src/main/jni
          rm -rf ffmpeg
          git clone --depth=1 -b release-9.0-fongmi https://github.com/WoKee/FFmpeg ffmpeg

      - name: Build FFmpeg static libraries
        run: |
          set -x
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          NDK_PATH="${ANDROID_NDK_HOME}"
          export FFMPEG_MODULE_PATH="$(pwd)/libraries/decoder_ffmpeg/src/main"
          export HOST_PLATFORM="linux-x86_64"
          export ANDROID_ABI=21
          echo "NDK_PATH=${NDK_PATH}"
          echo "FFMPEG_MODULE_PATH=${FFMPEG_MODULE_PATH}"
          ls -la "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -10
          ls -la "${FFMPEG_MODULE_PATH}/jni/ffmpeg/" | head -10
          cd "${FFMPEG_MODULE_PATH}/jni"
          chmod +x build_ffmpeg.sh
          bash -x build_ffmpeg.sh "${FFMPEG_MODULE_PATH}" "${NDK_PATH}" "${HOST_PLATFORM}" "${ANDROID_ABI}" vorbis opus flac 2>&1 | tee /tmp/ffmpeg-build.log; exit ${PIPESTATUS[0]}

      - name: Copy .a files to jniLibs
        run: |
          FFMPEG_LIBS="libraries/decoder_ffmpeg/src/main/jni/ffmpeg/android-libs"
          JNILIBS="libraries/decoder_ffmpeg/src/main/jniLibs"
          
          # arm64-v8a
          mkdir -p "${JNILIBS}/arm64-v8a"
          cp "${FFMPEG_LIBS}/arm64-v8a"/lib*.a "${JNILIBS}/arm64-v8a/"
          
          # armeabi-v7a
          mkdir -p "${JNILIBS}/armeabi-v7a"
          cp "${FFMPEG_LIBS}/armeabi-v7a"/lib*.a "${JNILIBS}/armeabi-v7a/"
          
          # Remove old .so files
          rm -f "${JNILIBS}/arm64-v8a"/*.so
          rm -f "${JNILIBS}/armeabi-v7a"/*.so
          
          echo "=== jniLibs contents ==="
          find "${JNILIBS}" -type f

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build AARs (assembleLibs)
        run: ./gradlew assembleLibs --no-daemon --stacktrace

      - name: Upload AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: media3-aars
          path: |
            libraries/*/buildout/outputs/aar/lib-*-release.aar
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-logs
          path: |
            /tmp/ffmpeg-build.log
          retention-days: 7
