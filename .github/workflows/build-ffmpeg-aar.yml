name: Build All AARs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Clone FFmpeg source
        run: |
          cd libraries/decoder_ffmpeg/src/main/jni
          git clone https://github.com/WoKee/FFmpeg --branch=release-9.0-fongmi --depth=1 ffmpeg

      - name: Build FFmpeg (all architectures)
        run: |
          export NDK_PATH="${ANDROID_SDK_ROOT}/ndk/27.0.12077973"
          echo "NDK_PATH: ${NDK_PATH}"
          chmod +x libraries/decoder_ffmpeg/src/main/jni/build_ffmpeg.sh
          chmod +x libraries/decoder_ffmpeg/src/main/jni/ffmpeg/configure
          FFMPEG_MODULE_PATH="$(pwd)/libraries/decoder_ffmpeg/src/main"
          bash "${FFMPEG_MODULE_PATH}/jni/build_ffmpeg.sh" \
            "${FFMPEG_MODULE_PATH}" \
            "${NDK_PATH}" \
            "linux-x86_64" \
            21 \
            vorbis opus flac ac3 eac3 truehd dca aac mp3 alac amrnb amrwb pcm_mulaw pcm_alaw

      - name: Verify FFmpeg static libs
        run: |
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            echo "--- ${arch} ---"
            ls -lh libraries/decoder_ffmpeg/src/main/jni/ffmpeg/android-libs/${arch}/
          done

      - name: Build all library AARs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.useAndroidX=true 2>&1 | tee gradle-build.log

      - name: Collect all AARs
        if: always()
        run: |
          mkdir -p aar-output
          find libraries -name "*.aar" -type f -exec cp {} aar-output/ \;
          echo "=== Collected AARs ==="
          ls -lh aar-output/
          echo "=== Total: $(ls aar-output/*.aar 2>/dev/null | wc -l) AARs ==="

      - name: Upload all AARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media3-all-aars
          path: aar-output/*.aar
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: gradle-build.log
          retention-days: 7
