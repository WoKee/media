name: Build FFmpeg Static Libs & Assemble AARs

on:
  workflow_dispatch:
  push:
    branches: [ release-1.11.0-fongmi ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: ilammy/setup-nasm@v1

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          local-cache: false
          add-to-path: true

      - name: Build FFmpeg and AARs
        run: |
          set -x
          FFMPEG_MODULE_PATH="${GITHUB_WORKSPACE}/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="${ANDROID_NDK_HOME:-${ANDROID_SDK_ROOT}/ndk/27.2.12479018}"
          
          # Clone FFmpeg
          cd "${FFMPEG_MODULE_PATH}/jni"
          rm -rf ffmpeg
          git clone --depth=1 -b release-9.0-fongmi https://github.com/WoKee/FFmpeg ffmpeg
          
          # Verify NDK
          echo "NDK_PATH=${NDK_PATH}"
          ls "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang" || echo "clang not found at expected path"
          which armv7a-linux-androideabi21-clang || echo "clang not in PATH"
          
          # Build FFmpeg
          chmod +x build_ffmpeg.sh
          bash build_ffmpeg.sh "${FFMPEG_MODULE_PATH}" "${NDK_PATH}" "linux-x86_64" 21 vorbis opus flac
          
          # Copy .a files
          JNILIBS="${FFMPEG_MODULE_PATH}/jniLibs"
          mkdir -p "${JNILIBS}/arm64-v8a" "${JNILIBS}/armeabi-v7a"
          cp "${FFMPEG_MODULE_PATH}/jni/ffmpeg/android-libs/arm64-v8a"/lib*.a "${JNILIBS}/arm64-v8a/"
          cp "${FFMPEG_MODULE_PATH}/jni/ffmpeg/android-libs/armeabi-v7a"/lib*.a "${JNILIBS}/armeabi-v7a/"
          rm -f "${JNILIBS}/arm64-v8a"/*.so "${JNILIBS}/armeabi-v7a"/*.so
          
          # Build AARs
          cd "${GITHUB_WORKSPACE}"
          chmod +x gradlew
          ./gradlew assembleLibs --no-daemon --stacktrace

      - name: Upload AAR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media3-aars
          path: libraries/*/buildout/outputs/aar/lib-*-release.aar
          retention-days: 7
