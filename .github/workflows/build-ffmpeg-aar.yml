name: Build FFmpeg Static Libs & Assemble AARs

on:
  workflow_dispatch:
  push:
    branches: [ release-1.11.0-fongmi ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: ilammy/setup-nasm@v1

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          local-cache: false
          add-to-path: true

      - name: Build FFmpeg and AARs
        run: |
          set -exo pipefail
          FFMPEG_MODULE_PATH="${GITHUB_WORKSPACE}/libraries/decoder_ffmpeg/src/main"
          BUILD_LOG="${GITHUB_WORKSPACE}/build-output.log"
          
          # Find NDK
          NDK_PATH=""
          if [ -n "${ANDROID_NDK_HOME}" ]; then
            NDK_PATH="${ANDROID_NDK_HOME}"
          elif [ -n "${ANDROID_SDK_ROOT}" ]; then
            NDK_PATH=$(find "${ANDROID_SDK_ROOT}/ndk" -maxdepth 1 -type d | sort -V | tail -1)
          fi
          echo "Found NDK at: ${NDK_PATH}"
          
          # Clone FFmpeg
          cd "${FFMPEG_MODULE_PATH}/jni"
          rm -rf ffmpeg
          git clone --depth=1 -b release-9.0-fongmi https://github.com/WoKee/FFmpeg ffmpeg 2>&1 | tee -a "${BUILD_LOG}"
          
          # Verify NDK tools
          CLANG_PATH="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          echo "Checking clang at: ${CLANG_PATH}"
          ls -la "${CLANG_PATH}" || echo "clang NOT found"
          
          # Build FFmpeg
          chmod +x build_ffmpeg.sh
          bash build_ffmpeg.sh "${FFMPEG_MODULE_PATH}" "${NDK_PATH}" "linux-x86_64" 21 vorbis opus flac 2>&1 | tee -a "${BUILD_LOG}"
          
          # Copy .a files
          JNILIBS="${FFMPEG_MODULE_PATH}/jniLibs"
          mkdir -p "${JNILIBS}/arm64-v8a" "${JNILIBS}/armeabi-v7a"
          cp "${FFMPEG_MODULE_PATH}/jni/ffmpeg/android-libs/arm64-v8a"/lib*.a "${JNILIBS}/arm64-v8a/"
          cp "${FFMPEG_MODULE_PATH}/jni/ffmpeg/android-libs/armeabi-v7a"/lib*.a "${JNILIBS}/armeabi-v7a/"
          rm -f "${JNILIBS}/arm64-v8a"/*.so "${JNILIBS}/armeabi-v7a"/*.so
          
          # Build AARs
          cd "${GITHUB_WORKSPACE}"
          chmod +x gradlew
          ./gradlew assembleLibs --no-daemon --stacktrace 2>&1 | tee -a "${BUILD_LOG}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          retention-days: 7

      - name: Upload AAR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media3-aars
          path: libraries/*/buildout/outputs/aar/lib-*-release.aar
          retention-days: 7
