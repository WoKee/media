name: Build FFmpeg Static Libs & Assemble AARs

on:
  workflow_dispatch:
  push:
    branches: [ release-1.11.0-fongmi ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: ilammy/setup-nasm@v1

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          local-cache: false
          add-to-path: true

      - name: Build FFmpeg and AARs
        run: |
          BUILD_LOG="${GITHUB_WORKSPACE}/build-output.log"
          # Redirect all output to log file (sync, no process substitution)
          exec > "$BUILD_LOG" 2>&1
          set -x

          # Ensure log is printed on exit
          cleanup() { sync; cat "$BUILD_LOG"; }
          trap cleanup EXIT

          FFMPEG_MODULE_PATH="${GITHUB_WORKSPACE}/libraries/decoder_ffmpeg/src/main"

          # Debug: show all env vars
          echo "=== NDK Debug Info ==="
          echo "ANDROID_NDK_HOME = ${ANDROID_NDK_HOME:-unset}"
          echo "ANDROID_NDK_ROOT = ${ANDROID_NDK_ROOT:-unset}"
          echo "ANDROID_NDK = ${ANDROID_NDK:-unset}"
          echo "ANDROID_SDK_ROOT = ${ANDROID_SDK_ROOT:-unset}"
          env | grep -i ndk || echo "No NDK env vars found"
          env | grep -i android || echo "No Android env vars found"

          # Find NDK - try multiple sources
          NDK=""
          if [ -d "${ANDROID_NDK_HOME:-}" ]; then
            NDK="${ANDROID_NDK_HOME}"
          elif [ -d "${ANDROID_NDK_ROOT:-}" ]; then
            NDK="${ANDROID_NDK_ROOT}"
          elif [ -d "${ANDROID_NDK:-}" ]; then
            NDK="${ANDROID_NDK}"
          else
            for d in /opt/hostedtoolcache/ndk /usr/local/lib/android/sdk/ndk /opt/android/ndk; do
              if [ -d "$d" ]; then
                echo "Found NDK dir at: $d"
                ls -la "$d"
                NDK=$(find "$d" -maxdepth 3 -name "ndk-build" -exec dirname {} \; 2>/dev/null | head -1)
                if [ -n "$NDK" ]; then break; fi
              fi
            done
          fi

          if [ -z "$NDK" ]; then
            echo "ERROR: Could not find NDK path!"
            exit 1
          fi
          echo "Using NDK: ${NDK}"
          echo "NDK contents:"
          ls -la "${NDK}/"

          # Verify toolchain
          TC="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "Toolchain dir: $TC"
          echo "Toolchain dir exists: $([ -d "$TC" ] && echo YES || echo NO)"
          if [ -d "$TC" ]; then
            ls "$TC"/armv7a-linux-androideabi* 2>/dev/null || echo "No armv7a clang found"
          fi

          # Clone FFmpeg
          cd "${FFMPEG_MODULE_PATH}/jni"
          rm -rf ffmpeg
          git clone --depth=1 -b release-9.0-fongmi https://github.com/WoKee/FFmpeg ffmpeg

          # Build FFmpeg
          chmod +x build_ffmpeg.sh
          bash build_ffmpeg.sh "${FFMPEG_MODULE_PATH}" "${NDK}" "linux-x86_64" 21 vorbis opus flac

          # Copy .a files
          JNILIBS="${FFMPEG_MODULE_PATH}/jniLibs"
          mkdir -p "${JNILIBS}/arm64-v8a" "${JNILIBS}/armeabi-v7a"
          cp "${FFMPEG_MODULE_PATH}/jni/ffmpeg/android-libs/arm64-v8a"/lib*.a "${JNILIBS}/arm64-v8a/"
          cp "${FFMPEG_MODULE_PATH}/jni/ffmpeg/android-libs/armeabi-v7a"/lib*.a "${JNILIBS}/armeabi-v7a/"
          rm -f "${JNILIBS}/arm64-v8a"/*.so "${JNILIBS}/armeabi-v7a"/*.so

          # Build AARs
          cd "${GITHUB_WORKSPACE}"
          chmod +x gradlew
          ./gradlew assembleLibs --no-daemon --stacktrace

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          retention-days: 7

      - name: Upload AAR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media3-aars
          path: libraries/*/buildout/outputs/aar/lib-*-release.aar
          retention-days: 7
