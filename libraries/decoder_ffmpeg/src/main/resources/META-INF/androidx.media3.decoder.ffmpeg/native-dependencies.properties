# Native dependency provenance for the FFmpeg libraries used by this module.
# Since the static-link build, FFmpeg .a archives are compiled by
# build_ffmpeg.sh and linked directly into libffmpegJNI.so.
schema.version=3
manifest.kind=decoder-ffmpeg-consumer
ffmpeg.repository=https://github.com/WoKee/FFmpeg
ffmpeg.branch=release/9.0-fongmi
ffmpeg.version=9.0
ffmpeg.libavcodec.version=63.3.100
android.ndk.version=29.0.14206865
abi.list=armeabi-v7a,arm64-v8a
# FFmpeg is now statically linked; only libffmpegJNI.so is produced.
library.list=libffmpegJNI.so
link.mode=static
# libplacebo and renderer-sdk have been removed.
